[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readonly-sql-mcp"
version = "0.1.0"
description = "A read-only MCP server for safely exploring SQLite databases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "readonly-sql-mcp contributors" }]
dependencies = [
  "mcp>=1.9,<3",
  "sqlglot>=26,<31",
  "typing-extensions>=4.9",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<3",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
readonly-sql-mcp = "readonly_sql_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/readonly_sql_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["readonly_sql_mcp"]

[tool.pytest.ini_options]
addopts = "--cov=readonly_sql_mcp --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
